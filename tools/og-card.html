<!doctype html>
<!--
  这张卡片只在「生成 og:image」时用：用浏览器把本页渲染出来截图为 public/og.png。
  它不是站点页面，也不会被构建打包（放在 tools/ 下，vite 只打 public/ 与 index.html）。

  尺寸为什么是 1280×720 而不是「标准」的 1200×630：无头浏览器的视口固定 1280×720，
  截图就是视口大小，而本地没有图像裁剪依赖（不值得为它引入 sharp/canvas）。
  og:image 的硬要求是「宽度 ≥1200 且尽量接近 1.91:1」，16:9 按 1.91:1 显示时上下各裁 ~25px，
  而正文距上下边缘有 84px，因此裁不到内容。改尺寸时记得同步
  src/seo-pages.js 的 OG_IMAGE 与 index.html 的 og:image:width/height。
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ImgCrop og:image card</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; }
      body {
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(1280px 780px at 78% -12%, #6fb4ff 0%, #409eff 42%, #1b4f9c 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 84px 88px;
      }
      .brand { display: flex; align-items: center; gap: 18px; font-size: 31px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.94; }
      .brand .mark {
        width: 54px; height: 54px; border-radius: 14px; background: rgba(255, 255, 255, 0.16);
        border: 2px solid rgba(255, 255, 255, 0.45); position: relative;
      }
      .brand .mark::before, .brand .mark::after {
        content: ""; position: absolute; background: #fff; border-radius: 2px;
      }
      .brand .mark::before { left: 13px; top: 16px; width: 26px; height: 2.5px; box-shadow: 0 10px 0 #fff; }
      .brand .mark::after { left: 25px; top: 16px; width: 2.5px; height: 22px; }
      h1 { font-size: 84px; line-height: 1.05; font-weight: 700; letter-spacing: -2px; }
      h1 .accent { color: #d7ecff; }
      .sub { margin-top: 24px; font-size: 35px; line-height: 1.35; color: rgba(255, 255, 255, 0.92); max-width: 1000px; }
      .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
      .tiles { display: flex; gap: 13px; }
      .tiles i {
        display: block; width: 58px; height: 58px; border-radius: 11px;
        background: rgba(255, 255, 255, 0.22); border: 2px solid rgba(255, 255, 255, 0.5);
      }
      .tiles i:nth-child(2) { background: rgba(255, 255, 255, 0.42); }
      .tiles i:nth-child(4) { background: rgba(255, 255, 255, 0.32); }
      .note { font-size: 28px; color: rgba(255, 255, 255, 0.9); text-align: right; line-height: 1.5; }
      .note b { font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="brand"><span class="mark"></span> imgcrop.guoguo-labs.online</div>

    <div>
      <h1>Split one image<br />into <span class="accent">many PNGs</span></h1>
      <p class="sub">Sprite sheets, sticker packs, product collages — auto-detected and cut apart in one click.</p>
    </div>

    <div class="bottom">
      <div class="tiles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p class="note"><b>100% in your browser</b><br />Nothing is uploaded · Free</p>
    </div>
  </body>
</html>
